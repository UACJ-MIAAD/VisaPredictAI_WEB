name: CI

# G4: gate mínimo del portal — antes Netlify deployaba `main` sin ninguna validación.
# No construye el sitio (eso lo hace Netlify); valida tipos, lint y el guard anti-código
# del bot. El índice RAG y su gate corren en el build de Netlify (necesitan el modelo).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (+ pisos de cobertura por área — G3)
        run: npm run test:coverage
      # E1 (plan 2026-07-12): cobertura HONESTA con denominador visible. La config
      # de vitest mide con `all: true` sobre TODO lib/ + netlify/functions (no solo
      # los módulos ya testeados); este paso publica cubierto/total en el summary
      # para que nadie lea el % como si fuera de otro denominador.
      - name: Coverage summary (denominador visible — E1)
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].covered}/${t[k].total} | ${t[k].pct}% |`;
              const md = [
                "## Cobertura web (lib/ + netlify/functions, `all: true`)",
                "",
                "El denominador incluye TODOS los módulos de lógica (los no testeados cuentan al 0%);",
                "componentes React y `*.generated.ts` quedan fuera (ver comentario en vitest.config.ts).",
                "",
                "| Métrica | Cubierto/Total | % |",
                "|---|---|---|",
                row("statements"), row("branches"), row("functions"), row("lines"),
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            '
          else
            echo "coverage/coverage-summary.json no existe (¿fallaron los tests antes de medir?)"
          fi
      - name: Upload coverage report (artefacto)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-web
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30
      # NOTA: scripts/scorecard-render-check.mjs NO corre aquí — requiere el
      # export completo en out/ (Netlify hace ese build) y un binario de Chrome
      # con ruta hardcodeada de macOS; sigue siendo un check manual post-build.
      - name: VisaBot code-guard suite
        run: |
          # test-code-guard importa chat.mjs, que requiere el hash allowlist generado
          # en build; para el gate basta un stub vacío (el guard no usa los hashes).
          [ -f netlify/functions/rag-hashes.json ] || echo '[]' > netlify/functions/rag-hashes.json
          node scripts/test-code-guard.mjs
      # G2: estructura + versión (hash de contenido) de los sets de evaluación del RAG.
      # La suite completa (índice real + gate por estrato) corre en scheduled-quality.yml.
      - name: Eval sets (estructura + versión)
        run: node scripts/check-eval-sets.mjs

  # G1 (plan auditoría 2026-07-11): el MISMO next build/export/CSP que corre Netlify,
  # pero SIN red — los fallbacks commiteados en public/data son la release fixture
  # inmutable del checkout. verify-build.mjs falla si el export pierde rutas ES/EN,
  # el sitemap, las OG images, la CSP sin unsafe-inline o los assets del corte.
  # (El índice RAG queda fuera de este job: necesita el modelo de embeddings — G2.)
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Offline production build + export verification
        run: npm run build:offline

  # US E3 (plan auditoría 3 repos, 2026-07-12): E2E portable de responsive,
  # teclado y a11y (Playwright + axe) contra el MISMO export offline del job
  # build-offline (fixture inmutable del checkout, sin red de datos). Job
  # independiente (sin `needs`: no bloquea ni espera a los demás) pero pensado
  # como REQUIRED en branch protection — marcarlo ahí, no aquí.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium (+OS deps)
        run: npx playwright install --with-deps chromium
      - name: Offline production build (export under test)
        run: npm run build:offline
      - name: E2E suite (responsive + keyboard + axe + touch targets)
        run: npm run test:e2e
      # Traces + report only when something failed (debugging payload).
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      # Visual-regression captures: uploaded on EVERY run (they are artifacts
      # to diff between runs, not compared baselines — cross-OS font
      # rasterization makes pixel baselines flaky; see screenshots.spec.ts).
      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 30

  # Integración CON red (no bloqueante): ¿el manifiesto de release publicado sigue
  # siendo alcanzable y verificable de punta a punta? Un fallo aquí señala
  # disponibilidad del raw host o un corte a medio publicar — no veta el PR.
  fetch-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Live manifest fetch + hash verification
        run: node scripts/fetch-data.mjs
