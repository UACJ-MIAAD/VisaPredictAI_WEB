# Static export — no Next.js runtime/plugin needed; publish the prerendered out/.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# VisaBot generation runs as a serverless function (Claude proxy).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Persist the on-device embedding model (~129 MB) + ORT wasm across builds so
# each deploy doesn't re-download them (the index is still re-embedded fresh).
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["public/models", "public/ort"]

# Security headers (best-practice baseline).
# BA5 — the Content-Security-Policy does NOT live here anymore: script-src now
# uses sha256 hashes instead of 'unsafe-inline', and the hashes depend on the
# exact bytes of each page's inline scripts (Next inlines its Flight payload
# per page). scripts/build-csp.mjs runs as `postbuild`, hashes every inline
# script in out/**/*.html and emits per-page CSP rules into out/_headers.
# Keep the base policy in that script — not here — to avoid double CSP
# (Netlify merges netlify.toml + _headers, and two CSPs intersect).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# The on-device model + WASM are large and immutable — cache them hard.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-cache the immutable build assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# AZ6 — data + RAG payloads refresh with each bulletin (~monthly): let the CDN
# serve them for an hour and revalidate in the background for a day.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
[[headers]]
  for = "/rag/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The generated OG images have no file extension — serve them as PNG so social
# scrapers accept them. BA7 added per-route variants (/x/opengraph-image and
# /en/x/opengraph-image); :seg matches exactly one path segment.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
[[headers]]
  for = "/:seg/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
[[headers]]
  for = "/en/:seg/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
